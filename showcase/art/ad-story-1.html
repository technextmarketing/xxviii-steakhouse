<style>
.cta{position:absolute;left:72px;top:1486px;width:936px;height:92px;background:var(--brass);color:var(--char);display:flex;align-items:center;justify-content:center;gap:26px;font:700 36px/1 var(--f-label);letter-spacing:.34em;z-index:6;overflow:hidden;box-shadow:0 18px 34px rgba(0,0,0,.45)}
.cta .ar{width:44px;height:2px;background:var(--char);position:relative}
.cta .ar::after{content:"";position:absolute;right:0;top:-6px;width:12px;height:12px;border-top:2px solid var(--char);border-right:2px solid var(--char);transform:rotate(45deg)}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:22%;background:linear-gradient(100deg,transparent,rgba(255,244,214,.45),transparent);transform:translateX(0) skewX(-18deg);opacity:0}
.live .cta::after{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(0) skewX(-18deg);opacity:0}60%{opacity:1}100%{transform:translateX(620%) skewX(-18deg);opacity:0}}
.logo{position:absolute;z-index:8}

.ab{background:var(--char)}
.ph{position:absolute;left:0;top:0;width:1080px;height:1040px;overflow:hidden}
.ph img{max-width:none;position:absolute;left:-10px;top:-10px;width:1100px;height:1100px;object-fit:cover;object-position:50% 50%;transform-origin:50% 55%}
.ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,var(--char))}
.ph::before{content:"";position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(rgba(10,8,7,.7),transparent);z-index:2}
.logo{left:72px;top:272px;width:200px}
.tag{position:absolute;right:72px;top:96px;z-index:8}
.hair{position:absolute;left:72px;top:1036px;width:140px;height:2px;background:var(--brass);z-index:3}
.head{position:absolute;left:72px;top:1066px;font-size:172px;line-height:.93;white-space:nowrap;z-index:3}
.sub{position:absolute;left:72px;top:1400px;width:900px;font:400 34px/1.35 var(--f-body);color:var(--ash);z-index:3}
.sub b{font-weight:400;color:var(--bone)}
@keyframes ken{0%{transform:scale(1) translateY(0)}100%{transform:scale(1.06) translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.live .ph img{animation:ken 8s ease-in-out infinite alternate}
.live .lamp{animation:pulse 5s ease-in-out infinite}
.lamp{left:560px;top:-120px;width:760px;height:760px;z-index:1;opacity:.8}

/* safe zones: nothing in the top 250 px; Meta draws the CTA and the profile, so no logo or CTA bar */
.ab > .logo{display:none}
.ab > :not(.grain-ab):not(.vignette):not(.pool){translate:0 190px}
