<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>XXVIII · post 09 · A room for fourteen</title>
<link rel="stylesheet" href="../../assets/css/brand.css">
<link rel="stylesheet" href="art.css">
<style>
.ab{background:radial-gradient(100% 60% at 50% 62%,#2b211b 0%,var(--char) 72%)}
.hl{position:absolute;left:64px;top:84px;font-size:140px;line-height:.93}
.stage{position:absolute;left:0;top:420px;width:1080px;height:650px;perspective:1500px;perspective-origin:50% 0%}
.plan{position:absolute;left:40px;top:70px;width:1000px;height:440px;transform:rotateX(38deg) rotateZ(-9deg) scale(1.08);transform-origin:50% 50%}
.copy{position:absolute;left:64px;right:64px;bottom:176px}
.copy p{font-size:36px;line-height:1.3;color:var(--bone);width:760px}
.enq{position:absolute;left:64px;right:64px;bottom:64px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:28px}
.enq .lbl{color:var(--brass);font-size:26px}
.enq .lbl span{color:var(--bone)}
.logo{position:absolute;right:64px;top:96px;width:180px}
</style></head><body>
<div class="ab post">
  <h1 class="disp hl">A room<br>for fourteen.</h1>
  <img class="logo" src="../../assets/logo/xxviii-horizontal-brass.svg" alt="XXVIII">
  <div class="stage">
  <svg class="plan" viewBox="0 0 1000 440">
    <defs>
      <linearGradient id="wal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4333"/><stop offset=".5" stop-color="#3e2e24"/><stop offset="1" stop-color="#2a2019"/></linearGradient>
      <radialGradient id="lp"><stop offset="0" stop-color="#ecd3a2" stop-opacity=".75"/><stop offset=".4" stop-color="#c29a5b" stop-opacity=".3"/><stop offset="1" stop-color="#c29a5b" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="chairs" fill="#1f1a18" stroke="#c29a5b" stroke-width="2.5"></g>
    <rect x="30" y="120" width="940" height="200" rx="4" fill="url(#wal)" stroke="#c29a5b" stroke-opacity=".5" stroke-width="1.5"/>
    <g id="plates" fill="none" stroke="#efe7da" stroke-opacity=".6" stroke-width="2.5"></g>
    <circle cx="200" cy="220" r="150" fill="url(#lp)"/><circle cx="500" cy="220" r="150" fill="url(#lp)"/><circle cx="800" cy="220" r="150" fill="url(#lp)"/>
    <g fill="#ecd3a2"><circle cx="200" cy="220" r="7"/><circle cx="500" cy="220" r="7"/><circle cx="800" cy="220" r="7"/></g>
  </svg></div>
  <div class="copy"><p>The private room. For long dinners that shouldn&rsquo;t end early.</p></div>
  <div class="enq"><span class="lbl">Enquire</span><span class="lbl"><span>reservations@xxviii.example</span></span></div>
  <div class="vignette"></div><div class="grain-ab"></div>
</div>
<script>
(function(){var c='',p='',i,x;
for(i=0;i<7;i++){x=85+i*135;
c+='<rect x="'+(x-34)+'" y="62" width="68" height="46" rx="12"/><rect x="'+(x-34)+'" y="332" width="68" height="46" rx="12"/>';
p+='<circle cx="'+x+'" cy="158" r="26"/><circle cx="'+x+'" cy="282" r="26"/><circle cx="'+x+'" cy="158" r="14"/><circle cx="'+x+'" cy="282" r="14"/>';}
document.getElementById('chairs').innerHTML=c;document.getElementById('plates').innerHTML=p;})();
</script></body></html>
